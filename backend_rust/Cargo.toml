[package]
name = "backend_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "bigdecimal"] }

# MongoDB (data treatment fleksibel untuk prediksi)
mongodb = "3"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"

# HTTP Client (for Python backend)
reqwest = { version = "0.12", features = ["json"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# BigDecimal (serde support)
bigdecimal = { version = "0.4", features = ["serde"] }

# Hex encoding
hex = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"
