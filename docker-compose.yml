services:
  # ============================================================
  # DATABASE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: helpin-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: helpin
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend_rust/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    networks:
      - helpin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpin"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: helpin-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - helpin-network

  # ============================================================
  # BACKEND RUST (Core API)
  # ============================================================
  backend_rust:
    build:
      context: ./backend_rust
      dockerfile: Dockerfile
    container_name: helpin-backend-rust
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres@postgres:5432/helpin
      MONGODB_URI: mongodb://mongodb:27017
      JWT_SECRET: rahasia_aman_helpin_2026
      ML_SERVICE_URL: http://backend_python:8081
      BLOCKCHAIN_RPC_URL: http://localhost:8545
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: info
    networks:
      - helpin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ============================================================
  # BACKEND PYTHON (ML Service)
  # ============================================================
  backend_python:
    build:
      context: ./backend_python
      dockerfile: Dockerfile
    container_name: helpin-backend-python
    ports:
      - "8081:8081"
    environment:
      MODEL_PATH: /app/ml_models
      HOST: 0.0.0.0
      PORT: 8081
    networks:
      - helpin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ============================================================
  # FRONTEND NUXT (Pre-built)
  # 
  # ============================================================
  helpin_nuxt:
    build:
      context: ./helpin_nuxt
      dockerfile: Dockerfile
    container_name: helpin-nuxt
    ports:
      - "3000:3000"
    depends_on:
      backend_rust:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080
    networks:
      - helpin-network
    restart: unless-stopped

networks:
  helpin-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
